<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>DailyActivity</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">DA</div>
        <div>
          <h1>DailyActivity</h1>
          <p>Collection &amp; Loan Management</p>
        </div>
      </div>
      <form id="loginForm">
        <label>Phone Number</label>
        <input type="tel" id="loginPhone" placeholder="10 digit mobile number" required />
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" class="btn-primary">Login</button>
        <p id="loginError" class="error hidden"></p>
      </form>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mark small">DA</span>
        <div>
          <div id="userName" class="user-name"></div>
          <div id="userMeta" class="user-meta"></div>
        </div>
      </div>
      <div class="topbar-right">
        <button id="btnChangePw" class="btn-ghost">Password Change</button>
        <button id="btnLogout" class="btn-ghost">Logout</button>
      </div>
    </header>

    <nav id="tabNav" class="tab-nav"></nav>

    <main id="mainContent" class="main-content"></main>
  </div>

  <!-- CHANGE PASSWORD MODAL -->
  <div id="pwModal" class="modal hidden">
    <div class="modal-card">
      <h3>Password Change Karein</h3>
      <form id="pwForm">
        <div id="oldPwField" class="field">
          <label>Purana Password</label>
          <input type="password" id="oldPw" />
        </div>
        <div class="field">
          <label>Naya Password</label>
          <input type="password" id="newPw" required />
        </div>
        <div class="modal-actions">
          <button type="button" id="pwCancel" class="btn-ghost">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
        <p id="pwError" class="error hidden"></p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
