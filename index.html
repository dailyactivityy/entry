<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Desk</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f0;--surface:#fff;--pine:#12534a;--pine-d:#0c3b34;--gold:#f0ad1b;--gold-l:#fff3d1;--ink:#16211f;--mute:#5d6d6a;--line:#d3ddda;--bad:#b3261e;--good:#1b7a3d;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:'Mukta',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:inherit;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;min-height:44px;width:100%}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(18,83,74,.25)}
input[readonly]{background:#f4f7f6;color:var(--ink)}
input.bad{border-color:var(--bad);background:#fdeceb}
.top{position:sticky;top:0;z-index:20;background:var(--pine);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px}
.top h1{font-size:19px;margin:0 0 0 4px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:14px;opacity:.9;margin-right:4px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:transparent;border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.16)}
.ib svg,.mi svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;padding:14px 12px 120px}
.dbg{position:fixed;inset:0;background:rgba(12,59,52,.5);z-index:30;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.dbg.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:86vw;background:#fff;z-index:31;display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility .22s;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.drawer.open{transform:none;visibility:visible}
.dh{background:var(--pine);color:#fff;padding:18px 18px 16px}
.dh b{display:block;font-size:22px}
.dh span{font-size:14px;opacity:.85}
.dl{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.si{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-left:5px solid transparent;border-radius:8px;padding:13px 12px;font-size:18px;font-weight:500;color:var(--ink)}
.si svg{width:24px;height:24px;flex:none;color:var(--pine);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.si:hover{background:#f4f7f6}
.si.on{background:var(--gold-l);border-left-color:var(--gold);font-weight:700}
.stats{display:flex;gap:18px;align-items:flex-end}
.bar .btn{padding:10px 22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.login{max-width:400px;margin:12vh auto 0}
.login h2{margin:0 0 14px;font-size:26px;color:var(--pine)}
.login .fld{margin-bottom:12px}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.mi{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--pine);border-radius:var(--r);padding:16px;font-size:19px;font-weight:700;text-align:left;color:var(--ink)}
.mi:hover{border-left-color:var(--gold);background:#fbfcfb}
.mi svg{width:28px;height:28px;color:var(--pine);flex:none}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span,.lab{font-size:13px;color:var(--mute);font-weight:500}
.pk{display:grid;gap:12px;grid-template-columns:1fr}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:8px;min-height:44px;font-weight:500;color:var(--ink)}
.seg button.on{background:var(--gold);border-color:var(--gold);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;min-height:42px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:700}
.none{color:var(--mute);font-size:14px}
.btn{background:var(--pine);color:#fff;border:0;border-radius:8px;font-weight:700;padding:10px 26px;min-height:48px;font-size:17px}
.btn:hover{background:var(--pine-d)}
.btn:disabled{opacity:.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:8px;min-height:46px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--pine);border-color:var(--pine);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:15;padding:10px 12px}
.bar>div{width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar .tot{display:flex;flex-direction:column;line-height:1.1}
.bar .tot span{font-size:13px;color:var(--mute)}
.bar .tot b{font-size:24px}
.crow{display:grid;grid-template-columns:1fr 1fr 1fr 96px;column-gap:8px;row-gap:2px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;align-items:start}
.crow .c-name{grid-column:1/4;grid-row:1;font-weight:700;font-size:17px}
.crow .c-hus{grid-column:1/3;grid-row:2}
.crow .c-ph{grid-column:3;grid-row:2}
.crow .c-out{grid-column:1;grid-row:3}
.crow .c-od{grid-column:2;grid-row:3}
.crow .c-emi{grid-column:3;grid-row:3}
.crow .c-in{grid-column:4;grid-row:1/4;align-self:center}
.crow [data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mute);font-weight:500}
.crow .n{font-weight:700;font-size:16px}
.crow .due{color:var(--bad)}
.crow a{color:var(--pine);text-decoration:none;font-weight:500}
.crow .c-in input{text-align:right;font-weight:700;font-size:18px;border-color:var(--pine)}
.chead{display:none}
.empty{color:var(--mute);padding:16px 4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kv div{min-width:0}
.kv span{display:block;font-size:13px;color:var(--mute);font-weight:500}
.kv b{display:block;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.res{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:280px;overflow:auto}
.ri{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 12px;gap:0 10px}
.ri:last-child{border-bottom:0}
.ri:hover{background:var(--gold-l)}
.ri b{grid-column:1}
.ri em{grid-column:2;font-style:normal;font-weight:500;color:var(--pine)}
.ri small{grid-column:1/3;color:var(--mute);font-size:13px}
.upl,.upr{display:grid;grid-template-columns:1fr 1.3fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.upl span{font-size:13px;color:var(--mute);font-weight:500}
.sq{width:44px;height:44px;min-height:44px;padding:0;border-radius:8px;border:1.5px solid var(--pine);background:#fff;color:var(--pine);font-size:24px;font-weight:700;line-height:1}
.sq.rm{border-color:var(--line);color:var(--bad)}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px 12px}
.sum span{color:var(--mute)}
.sum b{text-align:right}
.big{font-size:30px;font-weight:700}
.hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:500;background:#f4f7f6}
td.n,th.n{text-align:right}
tr.tt td{font-weight:700;background:var(--gold-l)}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;z-index:60;max-width:92vw;font-weight:500}
.toast.bad{background:var(--bad)}
.busy{position:fixed;inset:0;background:rgba(237,241,240,.7);z-index:50;display:grid;place-items:center}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--pine);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
@media (min-width:760px){
.wrap{padding:22px 24px 120px}
.pk{grid-template-columns:1.2fr 2fr 1fr}
.pk .pg{grid-column:1/-1}
.crow,.chead{grid-template-columns:1.7fr 1.5fr 1.1fr .9fr .8fr .8fr 1fr;column-gap:12px;align-items:center;padding:8px 14px}
.chead{display:grid;background:transparent;border:0;margin-bottom:2px;font-size:13px;color:var(--mute);font-weight:500;padding-top:0;padding-bottom:0}
.chead .n{text-align:right}
.crow .c-name,.crow .c-hus,.crow .c-ph,.crow .c-out,.crow .c-od,.crow .c-emi,.crow .c-in{grid-column:auto;grid-row:auto}
.crow [data-l]::before{display:none}
.crow .n{text-align:right}
.crow .c-name{font-size:16px}
.chead .n{font-size:13px;font-weight:500}
}
@media (min-width:980px){
.wrap{padding:26px 34px 120px}
.bar{padding:10px 34px}
.top{padding:8px 18px}
.who{max-width:220px;font-size:15px}
.stats{gap:34px}
.bar .btn{padding:10px 40px}
}
</style>
</head>
<body>

<div class="top" id="top" hidden>
  <button class="ib" id="burger" aria-label="Menu" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h1 id="title">Loan Desk</h1>
  <span class="who" id="who"></span>
  <button class="ib" id="refresh" aria-label="Refresh"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  <button class="ib" id="logout" aria-label="Logout"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg></button>
</div>

<div class="shell" id="shell">
<main class="wrap">

<section id="v-login" class="login panel">
  <h2>Loan Desk</h2>
  <label class="fld"><span>Userid</span><input id="lu" autocomplete="username" autocapitalize="off"></label>
  <label class="fld"><span>Password</span><input id="lp" type="password" autocomplete="current-password"></label>
  <button class="btn" id="lgo" style="width:100%">Login</button>
</section>

<section id="v-home" hidden>
  <div class="menu">
    <button class="mi" data-go="coll"><svg viewBox="0 0 24 24"><path d="M6 4h12M6 9h12M9 4c5 0 7 2.5 7 5s-2 5-7 5H8l8 7"/></svg>Collection</button>
    <button class="mi" data-go="loan"><svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-3v3"/><circle cx="16" cy="14" r="1.5"/></svg>Loan Disbursed</button>
    <button class="mi" data-go="txn"><svg viewBox="0 0 24 24"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>Transaction</button>
    <button class="mi" data-go="cash"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cash in Hand</button>
    <button class="mi" data-go="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Customer History</button>
    <button class="mi" data-go="rep"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Report</button>
  </div>
</section>

<section id="v-coll" hidden>
  <div class="panel" id="collPick"></div>
  <div id="collList"></div>
  <div class="bar" id="collBar" hidden><div><div class="stats"><div class="tot"><span>Total Customer</span><b id="collCnt">0</b></div><div class="tot" id="collDemBox" hidden><span>Demand Amt</span><b id="collDem">0</b></div><div class="tot"><span>Net Amt</span><b id="collTot">0</b></div></div><button class="btn" id="collGo">Submit</button></div></div>
</section>

<section id="v-loan" hidden>
  <div class="tabs"><button data-m="existing" class="on">Existing Customer</button><button data-m="new">New Customer</button></div>
  <div class="panel" id="loanPick"></div>
  <div class="panel" id="lNewGroupBox" hidden><label class="fld"><span>Group Name</span><input id="lNewGroup" style="text-transform:uppercase"></label></div>
  <div class="panel" id="lSearchBox">
    <label class="fld"><span>Search</span><input id="lSearch" type="search" autocomplete="off"></label>
    <div class="res" id="lRes" hidden></div>
  </div>
  <div class="panel" id="lDetails" hidden><div class="kv" id="lKv"></div></div>
  <div class="panel" id="lNewFields" hidden>
    <div class="grid2">
      <label class="fld"><span>Customer Name</span><input id="lName" style="text-transform:uppercase"></label>
      <label class="fld"><span>Husband Name</span><input id="lHus" style="text-transform:uppercase"></label>
      <label class="fld"><span>Ph No</span><input id="lPh" inputmode="numeric" maxlength="10"></label>
    </div>
  </div>
  <div class="panel" id="lForm" hidden>
    <div class="grid2">
      <label class="fld"><span>Loan Amt</span><input id="lLoan" inputmode="numeric"></label>
      <label class="fld"><span>Aadhar No</span><input id="lAad" inputmode="numeric" maxlength="12"></label>
      <label class="fld"><span>Pan No</span><input id="lPan" maxlength="10" style="text-transform:uppercase" autocapitalize="characters"></label>
      <label class="fld"><span>Bank A/C No</span><input id="lBank" inputmode="numeric" maxlength="20"></label>
      <label class="fld"><span>Ifsc Code</span><input id="lIfsc" maxlength="11" style="text-transform:uppercase" autocapitalize="characters"></label>
      <label class="fld"><span>Closing Outstanding</span><input id="lClose" readonly></label>
    </div>
  </div>
  <div class="bar" id="lBar" hidden><div><span></span><button class="btn" id="lGo">Submit</button></div></div>
</section>

<section id="v-txn" hidden>
  <div class="panel" id="txnPick"></div>
  <div id="txnBody" hidden>
    <div class="panel">
      <div class="grid2">
        <label class="fld"><span>Hdfc Deposit</span><input id="tHd" inputmode="numeric"></label>
        <label class="fld"><span>Pnb Deposit</span><input id="tPd" inputmode="numeric"></label>
      </div>
    </div>
    <div class="panel">
      <div class="upl"><span>Hdfc Upi Amt</span><span>Transaction Id</span><span></span></div>
      <div id="tHu"></div>
    </div>
    <div class="panel">
      <div class="upl"><span>Pnb Upi Amt</span><span>Transaction Id</span><span></span></div>
      <div id="tPu"></div>
    </div>
    <div class="panel"><div class="sum">
      <span>Hdfc Deposit Amt</span><b id="sHd">0</b>
      <span>Pnb Deposit Amt</span><b id="sPd">0</b>
      <span>Hdfc Upi Amt</span><b id="sHu">0</b>
      <span>Pnb Upi Amt</span><b id="sPu">0</b>
    </div></div>
    <div class="bar"><div><span></span><button class="btn" id="tGo">Submit</button></div></div>
  </div>
</section>

<section id="v-cash" hidden>
  <div class="panel" id="cashPick"></div>
  <div id="cashBody" hidden>
    <div class="panel">
      <div class="grid2">
        <label class="fld"><span>Opening Cash</span><input id="kOpen" inputmode="numeric"></label>
        <label class="fld"><span>Collection</span><input id="kColl" readonly></label>
        <label class="fld"><span>Misc Inc</span><input id="kMisc" inputmode="numeric"></label>
      </div>
      <hr class="hr">
      <div class="sum"><span>Total Income</span><b class="big" id="kInc">0</b></div>
    </div>
    <div class="panel">
      <div class="grid2">
        <label class="fld"><span>Hdfc Deposit</span><input id="kHd" readonly></label>
        <label class="fld"><span>Pnb Deposit</span><input id="kPd" readonly></label>
        <label class="fld"><span>Hdfc Upi</span><input id="kHu" readonly></label>
        <label class="fld"><span>Pnb Upi</span><input id="kPu" readonly></label>
      </div>
      <hr class="hr">
      <div class="sum"><span>Total Expense</span><b class="big" id="kExp">0</b></div>
    </div>
    <div class="panel"><div class="sum"><span>Close Cash</span><b class="big" id="kClose">0</b></div></div>
    <div class="bar"><div><span></span><button class="btn" id="kGo">Submit</button></div></div>
  </div>
</section>

<section id="v-hist" hidden>
  <div class="panel">
    <div class="pk" style="grid-template-columns:1fr">
      <label class="fld"><span>Branch</span><select id="hB"></select></label>
      <label class="fld"><span>Search</span><input id="hQ" type="search" autocomplete="off"></label>
    </div>
    <div class="res" id="hRes" hidden></div>
  </div>
  <div id="hOut"></div>
</section>

<section id="v-rep" hidden>
  <div class="panel">
    <div class="grid2">
      <label class="fld"><span>Branch</span><select id="rB"></select></label>
      <label class="fld"><span>From</span><input id="rF" type="date"></label>
      <label class="fld"><span>To</span><input id="rT" type="date"></label>
    </div>
    <div style="margin-top:12px"><button class="btn" id="rGo">Show</button></div>
  </div>
  <div id="rOut"></div>
</section>

</main>
</div>

<div class="dbg" id="dbg"></div>
<nav class="drawer" id="drawer" aria-label="Menu"><div class="dh"><b>Loan Desk</b><span id="dwho"></span></div><div class="dl" id="dlist"></div></nav>

<div class="busy" id="busy" hidden><div class="spin"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbypNadmbnx6DGeQY_sT4iSeZV9opTy0mnb5Xt_ZpDljrX5jh1jplkXLT3NRipBR-0W10Q/exec';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const ALLDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TITLES={home:'Loan Desk',coll:'Collection',loan:'Loan Disbursed',txn:'Transaction',cash:'Cash in Hand',hist:'Customer History',rep:'Report'};
const S={token:'',name:'',role:'',branches:[],cust:[],byId:{},tree:{}};
let view='login';
let toastTimer=0;

const $=(q,r)=>(r||document).querySelector(q);
const $$=(q,r)=>Array.from((r||document).querySelectorAll(q));
const nf=n=>Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayOfIso=s=>{const p=s.split('-');return ALLDAYS[new Date(+p[0],+p[1]-1,+p[2]).getDay()];};
const dmy=s=>{const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
const digits=el=>{el.value=el.value.replace(/\D/g,'');};
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function latestDate(day){const d=new Date();for(let i=0;i<7;i++){if(ALLDAYS[d.getDay()]===day)return isoOf(d);d.setDate(d.getDate()-1);}return isoOf(new Date());}

function toast(msg,bad){
  const t=$('#toast');
  t.textContent=msg;
  t.className='toast'+(bad?' bad':'');
  t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.hidden=true;},bad?3600:2000);
}
function busy(on){$('#busy').hidden=!on;}

async function call(action,payload){
  if(!API_URL||API_URL.indexOf('PASTE_')===0)throw new Error('API_URL not set in index.html');
  let res;
  try{
    res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:action,token:S.token,p:payload||{}})});
  }catch(e){throw new Error('No internet or server not reachable');}
  let r;
  try{r=await res.json();}catch(e){throw new Error('Server error. Try again');}
  if(r&&r.ok)return r.data;
  throw new Error((r&&r.error)||'Failed');
}
async function safe(fn,withBusy){
  if(withBusy)busy(true);
  try{return await fn();}
  catch(e){
    if(e.message==='SESSION'){signOut();toast('Login again',true);}
    else toast(e.message,true);
    return null;
  }
  finally{if(withBusy)busy(false);}
}

function applyBoot(d){
  S.name=d.name;S.role=d.role;S.branches=d.branches;
  S.cust=d.customers.map(a=>({id:a[0],branch:a[1],day:a[2],group:a[3],name:a[4],husband:a[5],phone:a[6],emi:a[7],close:a[8],od:a[9]}));
  buildTree();
}
function buildTree(){
  S.byId={};
  const t={};
  S.cust.forEach(c=>{
    S.byId[c.id]=c;
    if(!t[c.branch])t[c.branch]={};
    if(!t[c.branch][c.day])t[c.branch][c.day]=new Set();
    t[c.branch][c.day].add(c.group);
  });
  S.tree=t;
}
function groupsOf(b,d){const s=S.tree[b]&&S.tree[b][d];return s?Array.from(s).sort():[];}

function picker(host,cfg){
  const st={branch:'',day:'',date:isoOf(new Date()),group:''};
  const tn=ALLDAYS[new Date().getDay()];
  if(cfg.day&&DAYS.indexOf(tn)>=0)st.day=tn;
  const last=lsGet('branch');
  st.branch=S.branches.length===1?S.branches[0]:(S.branches.indexOf(last)>=0?last:'');
  host.innerHTML='<div class="pk">'+
    '<label class="fld"><span>Branch</span><select class="pb"></select></label>'+
    (cfg.day?'<div class="fld"><span>Day</span><div class="seg"></div></div>':'')+
    '<label class="fld"><span>Date</span><input class="pd" type="date"></label>'+
    (cfg.group?'<div class="fld pg"><span>Group</span><div class="chips"></div></div>':'')+
    '</div>';
  const pb=$('.pb',host),pd=$('.pd',host),dEl=cfg.day?$('.seg',host):null,gEl=cfg.group?$('.chips',host):null;
  pb.innerHTML='<option value="">Select Branch</option>'+S.branches.map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');
  if(dEl)dEl.innerHTML=DAYS.map(d=>'<button type="button" data-d="'+d+'">'+d.slice(0,3)+'</button>').join('');
  function paintGroups(){
    if(!gEl)return;
    const list=groupsOf(st.branch,st.day);
    let h=list.map(g=>'<button type="button" class="chip'+(st.group===g?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</button>').join('');
    if(cfg.newGroup&&st.branch)h+='<button type="button" class="chip'+(st.group==='__new__'?' on':'')+'" data-g="__new__">New Group</button>';
    if(!h)h='<span class="none">'+(st.branch?'No groups':'')+'</span>';
    gEl.innerHTML=h;
  }
  function paint(){
    pb.value=st.branch;
    pd.value=st.date;
    if(dEl)$$('button',dEl).forEach(b=>b.classList.toggle('on',b.dataset.d===st.day));
    paintGroups();
  }
  function fire(w){if(cfg.onChange)cfg.onChange(w);}
  pb.addEventListener('change',()=>{st.branch=pb.value;st.group='';lsSet('branch',st.branch);paintGroups();fire('branch');});
  if(dEl)dEl.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    st.day=b.dataset.d;
    st.group='';paint();fire('day');
  });
  pd.addEventListener('change',()=>{
    if(!pd.value)return;
    st.date=pd.value;
    paint();fire('date');
  });
  if(gEl)gEl.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    st.group=b.dataset.g;paintGroups();fire('group');
  });
  paint();
  return {st:st,cfg:cfg,paint:paint,paintGroups:paintGroups,set:function(o){Object.assign(st,o);paint();}};
}

const C={p:null,rows:[],req:0,ready:false};
function defPut(c){const e=typeof c.emi==='number'?c.emi:0;const v=Math.min(e,c.close);return v>0?String(v):'';}
LOADERS.coll=()=>collLoad();
function collLoad(){
  const st=C.p.st;
  if(!st.branch||!st.day||!st.group){C.rows=[];$('#collList').innerHTML='';$('#collBar').hidden=true;return;}
  C.ready=false;
  C.rows=S.cust.filter(c=>c.branch===st.branch&&c.day===st.day&&c.group===st.group).map(c=>({c:c,ex:null,val:defPut(c),touched:false}));
  collPaint();
  const req=++C.req;
  safe(()=>call('collectionEntries',{branch:st.branch,date:st.date})).then(map=>{
    if(!map||req!==C.req)return;
    C.rows.forEach(r=>{
      r.ex=map[r.c.id]||null;
      if(r.ex&&!r.touched)r.val=String(r.ex.put);
    });
    C.ready=true;
    collPaint();
  });
}
function collPaint(){
  const list=$('#collList');
  if(!C.rows.length){list.innerHTML='<div class="empty">No customers</div>';$('#collBar').hidden=true;return;}
  let h='<div class="crow chead"><div>Customer Name</div><div>Husband Name</div><div>Ph No</div><div class="n">Outstanding</div><div class="n">OD Amt</div><div class="n">Emi Amt</div><div class="n">Put Amt</div></div>';
  h+=C.rows.map((r,i)=>{
    const c=r.c,out=r.ex?r.ex.open:c.close,od=r.ex?r.ex.odb:c.od;
    return '<div class="crow">'+
      '<div class="c-name">'+esc(c.name)+'</div>'+
      '<div class="c-hus" data-l="Husband Name">'+esc(c.husband)+'</div>'+
      '<div class="c-ph" data-l="Ph No">'+(c.phone?'<a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':'&nbsp;')+'</div>'+
      '<div class="n c-out" data-l="Outstanding">'+nf(out)+'</div>'+
      '<div class="n c-od'+(od>0?' due':'')+'" data-l="OD Amt">'+nf(od)+'</div>'+
      '<div class="n c-emi" data-l="Emi Amt">'+(c.emi==='TO'?'TO':nf(c.emi))+'</div>'+
      '<div class="c-in"><input inputmode="numeric" data-i="'+i+'" value="'+esc(r.val)+'" aria-label="Put Amt"></div>'+
      '</div>';
  }).join('');
  list.innerHTML=h;
  $('#collBar').hidden=false;
  collTotal();
}
function collTotal(){
  let t=0,dem=0;
  C.rows.forEach(r=>{t+=Number(r.val||0);if(typeof r.c.emi==='number')dem+=r.c.emi;});
  const st=C.p.st;
  $('#collTot').textContent=nf(t);
  $('#collCnt').textContent=nf(C.rows.length);
  const showDem=st.day&&st.day===dayOfIso(st.date);
  $('#collDemBox').hidden=!showDem;
  $('#collDem').textContent=nf(dem);
}
$('#collList').addEventListener('input',e=>{
  const el=e.target;if(el.tagName!=='INPUT')return;
  digits(el);
  const r=C.rows[+el.dataset.i];
  const out=r.ex?r.ex.open:r.c.close;
  if(Number(el.value||0)>out){el.value=String(out);toast('Put Amt cannot be more than Outstanding',true);}
  r.val=el.value;
  r.touched=true;
  collTotal();
});
$('#collList').addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  e.preventDefault();
  const all=$$('#collList .c-in input');
  const n=all[all.indexOf(e.target)+1];
  if(n)n.focus();else e.target.blur();
});
$('#collGo').addEventListener('click',async()=>{
  const st=C.p.st,items=[];
  if(!C.ready){toast('Data not loaded. Tap refresh',true);return;}
  for(const r of C.rows){
    const put=Number(r.val||0),before=r.ex?r.ex.put:0,out=r.ex?r.ex.open:r.c.close;
    if(put>out){toast('Put Amt is more than Outstanding: '+r.c.name,true);return;}
    if(put!==before)items.push({id:r.c.id,put:put});
  }
  if(!items.length){toast('No change');return;}
  const res=await safe(()=>call('saveCollection',{branch:st.branch,day:st.day,date:st.date,group:st.group,items:items}),true);
  if(!res)return;
  const m={};items.forEach(i=>{m[i.id]=i.put;});
  C.rows.forEach(r=>{
    if(m[r.c.id]===undefined)return;
    const put=m[r.c.id];
    if(put===0){r.ex=null;r.val='';return;}
    r.ex={put:put,open:r.ex?r.ex.open:r.c.close,odb:r.ex?r.ex.odb:r.c.od};
  });
  res.customers.forEach(u=>{const c=S.byId[u.id];if(c){c.close=u.close;c.od=u.od;}});
  collPaint();
  toast('Saved');
});

function cashCalc(){
  const d=K.d;if(!d)return;
  const inc=Number($('#kOpen').value||0)+d.collection+Number($('#kMisc').value||0);
  const exp=d.hdfcDep+d.pnbDep+d.hdfcUpi+d.pnbUpi;

  $('#kExp').textContent=nf(exp);
  $('#kClose').textContent=nf(inc-exp);
}
['kOpen','kMisc'].forEach(id=>$('#'+id).addEventListener('input',e=>{K.dirty=true;digits(e.target);cashCalc();}));
$('#kGo').addEventListener('click',async()=>{
  const st=K.p.st;
  if(!st.branch){toast('Select Branch',true);return;}
  const res=await safe(()=>call('saveCash',{branch:st.branch,date:st.date,opening:Number($('#kOpen').value||0),misc:Number($('#kMisc').value||0)}),true);
  if(res)toast('Saved');
});

LOADERS.hist=()=>{};
function histSearch(){
  const b=$('#hB').value;
  if(!b){toast('Select Branch',true);return;}
  const list=findCust(b,$('#hQ').value,[]);
  if(!list.length){$('#hRes').hidden=true;return;}
  resBox($('#hRes'),list,async c=>{
    $('#hQ').value=c.phone||c.name;
    const d=await safe(()=>call('history',{id:c.id}),true);
    if(d)histShow(d);
  });
}
$('#hQ').addEventListener('input',histSearch);
$('#hB').addEventListener('change',()=>{lsSet('branch',$('#hB').value);$('#hRes').hidden=true;$('#hOut').innerHTML='';});
function histShow(d){
  const i=d.info;
  let paid=0;
  d.entries.forEach(x=>{paid+=x.put;});
  const kv=[['Customer Name',i.name],['Husband Name',i.husband],['Ph No',i.phone],['Branch',i.branch],['Day',i.day],['Group Name',i.group],
    ['Disb Date',i.disb],['Loan Amt',nf(i.loan)],['Emi Amt',i.emi==='TO'?'TO':nf(i.emi)],['Opening Outstanding',nf(i.opening)],
    ['Closing Outstanding',nf(i.close)],['OD Amt',nf(i.od)],['Total Put Amt',nf(paid)]];
  let h='<div class="panel"><div class="kv">'+kv.map(x=>'<div><span>'+x[0]+'</span><b>'+esc(x[1]||'-')+'</b></div>').join('')+'</div></div>';
  h+='<div class="panel tw"><table><thead><tr><th>Date</th><th class="n">Outstanding</th><th class="n">Put Amt</th><th class="n">Closing Outstanding</th></tr></thead><tbody>';
  h+=d.entries.length?d.entries.map(x=>'<tr><td>'+esc(x.date)+'</td><td class="n">'+nf(x.open)+'</td><td class="n">'+nf(x.put)+'</td><td class="n">'+nf(x.close)+'</td></tr>').join(''):'<tr><td colspan="4" class="none">No Emi</td></tr>';
  h+='</tbody></table></div>';
  $('#hOut').innerHTML=h;
}

LOADERS.rep=()=>{};
$('#rGo').addEventListener('click',async()=>{
  const f=$('#rF').value,t=$('#rT').value;
  if(!f||!t){toast('Select Date',true);return;}
  const list=await safe(()=>call('report',{branch:$('#rB').value,from:f,to:t}),true);
  if(!list)return;
  let dm=0,cl=0;
  list.forEach(x=>{dm+=x.demand;cl+=x.collected;});
  let h='<div class="panel tw"><table><thead><tr><th>Date</th><th>Branch</th><th class="n">Demand</th><th class="n">Collected</th><th class="n">Balance</th></tr></thead><tbody>';
  h+=list.length?list.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.branch)+'</td><td class="n">'+nf(x.demand)+'</td><td class="n">'+nf(x.collected)+'</td><td class="n">'+nf(x.demand-x.collected)+'</td></tr>').join('')+
    '<tr class="tt"><td>Total</td><td></td><td class="n">'+nf(dm)+'</td><td class="n">'+nf(cl)+'</td><td class="n">'+nf(dm-cl)+'</td></tr>':'<tr><td colspan="5" class="none">No Collection</td></tr>';
  h+='</tbody></table></div>';
  $('#rOut').innerHTML=h;
});

document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
function openMenu(){$('#drawer').classList.add('open');$('#dbg').classList.add('open');$('#burger').setAttribute('aria-expanded','true');}
function closeMenu(){$('#drawer').classList.remove('open');$('#dbg').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');}
$('#burger').addEventListener('click',()=>{$('#drawer').classList.contains('open')?closeMenu():openMenu();});
$('#dbg').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
$('#logout').addEventListener('click',signOut);
$('#refresh').addEventListener('click',reload);
$('#lgo').addEventListener('click',doLogin);
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('#lu').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lp').focus();});

(async function start(){
  const tok=lsGet('tok');
  if(!tok){go('login');return;}
  S.token=tok;
  busy(true);
  try{
    const d=await call('boot');
    applyBoot(d);enter();
  }catch(e){S.token='';if(e.message==='SESSION')lsSet('tok','');go('login');if(e.message!=='SESSION')toast(e.message,true);}
  finally{busy(false);}
})();
</script>
