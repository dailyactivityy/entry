<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Management Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">LM</div>
    <h1>Loan Management</h1>
    <p class="sub">Sign in with the username and password your admin gave you.</p>
    <div class="error-msg" id="login-error" style="display:none;"></div>
    <form id="login-form">
      <div class="field">
        <label>Username</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
    </form>
    <p class="hint">Trouble signing in? Contact your branch admin.</p>
  </div>
</div>

<!-- APP -->
<div id="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark">LM</div><span>Loan Management</span></div>
    <div class="nav-group-label">Menu</div>
    <div id="nav-items"></div>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="name" id="user-name">—</div>
        <div class="role" id="user-role">—</div>
      </div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;margin-top:8px;">Sign out</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
